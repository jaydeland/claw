    fill="none"
    stroke="#4A5568"
    stroke-width="20"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Eyes/bolts -->
  <circle cx="170" cy="120" r="12" fill="#4A5568" />
  <circle cx="230" cy="120" r="12" fill="#4A5568" />

  <!-- Left arm - outer path -->
  <path
    d="M 130 140 L 90 180 L 90 240 L 50 280 L 50 350 L 90 390 L 130 350"
    fill="none"
    stroke="#4A5568"
    stroke-width="20"
