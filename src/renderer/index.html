    <!-- Prevent theme flash: detect system/stored theme before render -->
    <script>
      (function() {
        var stored = localStorage.getItem('theme');

      /* Loading state before React loads - respects system theme */
      :root {
        --loading-bg: #ffffff;
        --loading-text: #09090b;

      .dark {

        --loading-text: #fafafa;
        --loading-logo: #71717a;

      body {

        margin: 0;
        background: var(--loading-bg);
        color: var(--loading-text);
      }
      /* Loading container - hidden when React renders */
      .loading-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--loading-bg);
        z-index: 9999;
        transition: opacity 150ms ease-out;
      }
      /* Hide loading when root has content */
      #root:not(:empty) + .loading-container,
      #root:not(:empty) ~ .loading-container {
        opacity: 0;
        pointer-events: none;
      }
      .loading-logo {
        width: 96px;
        height: auto;
        animation: claw-grip 2s ease-in-out infinite;
      }
      .loading-logo .logo-main {
        fill: var(--loading-text);
      }
      .loading-logo .logo-detail {
        fill: var(--loading-bg);
      }
      @keyframes claw-grip {
        0%, 100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(0.95);
          opacity: 0.8;
        }
      }
