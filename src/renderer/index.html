<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://*.posthog.com https://*.i.posthog.com; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:* https://unpkg.com https://21st.dev https://*.21st.dev https://*.posthog.com https://*.i.posthog.com; img-src 'self' data: blob: https:; media-src 'self' blob:;" />
    <title>Claw</title>
    <!-- Prevent theme flash: detect system/stored theme before render -->
    <script>
      (function() {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'light' ? 'light' : stored === 'dark' ? 'dark' : (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <style>
      /* Loading state before React loads - respects system theme */
      :root {
        --loading-bg: #ffffff;
        --loading-text: #09090b;
        --loading-logo: #a1a1aa;
      }
      .dark {
        --loading-bg: #09090b;
        --loading-text: #fafafa;
        --loading-logo: #71717a;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        background: var(--loading-bg);
        color: var(--loading-text);
      }
      /* Loading container - hidden when React renders */
      .loading-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--loading-bg);
        z-index: 9999;
        transition: opacity 150ms ease-out;
      }
      /* Hide loading when root has content */
      #root:not(:empty) + .loading-container,
      #root:not(:empty) ~ .loading-container {
        opacity: 0;
        pointer-events: none;
      }
      .loading-logo {
        width: 48px;
        height: 48px;
        animation: claw-grip 2s ease-in-out infinite;
      }
      .loading-logo path,
      .loading-logo circle,
      .loading-logo rect {
        fill: var(--loading-logo);
        stroke: var(--loading-logo);
      }
      @keyframes claw-grip {
        0%, 100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(0.95);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Loading indicator - separate from root so :empty works -->
    <div class="loading-container">
      <svg class="loading-logo" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Robotic claw body/head -->
        <path d="M 150 100 L 150 80 L 180 80 L 180 60 L 220 60 L 220 80 L 250 80 L 250 100 L 270 100 L 270 160 L 130 160 L 130 100 Z" fill="none" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Eyes/bolts -->
        <circle cx="170" cy="120" r="12"/>
        <circle cx="230" cy="120" r="12"/>
        <!-- Left arm - outer -->
        <path d="M 130 140 L 90 180 L 90 240 L 50 280 L 50 350 L 90 390 L 130 350" fill="none" stroke-width="20" stroke-linejoin="miter" stroke-linecap="round"/>
        <!-- Left arm - inner -->
        <path d="M 150 160 L 120 200 L 120 260 L 90 300 L 90 350" fill="none" stroke-width="20" stroke-linejoin="miter" stroke-linecap="round"/>
        <!-- Right arm - outer -->
        <path d="M 270 140 L 310 180 L 310 240 L 350 280 L 350 350 L 310 390 L 270 350" fill="none" stroke-width="20" stroke-linejoin="miter" stroke-linecap="round"/>
        <!-- Right arm - inner -->
        <path d="M 250 160 L 280 200 L 280 260 L 310 300 L 310 350" fill="none" stroke-width="20" stroke-linejoin="miter" stroke-linecap="round"/>
      </svg>
    </div>
    <script>
      console.log("[HTML] Inline script running - scripts work!");
      window.onerror = function(msg, url, line) {
        console.error("[HTML] Global error:", msg, "at", url, "line", line);
        document.getElementById("root").innerHTML = "<pre style='color:red;padding:20px'>Error: " + msg + "</pre>";
      };
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
