<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:* https://unpkg.com; img-src 'self' data: blob: https:; media-src 'self' blob:;" />
    <title>Claw</title>
    <!-- Prevent theme flash: detect system/stored theme before render -->
    <script>
      (function() {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'light' ? 'light' : stored === 'dark' ? 'dark' : (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <style>
      /* Loading state before React loads - respects system theme */
      :root {
        --loading-bg: #ffffff;
        --loading-text: #09090b;
        --loading-logo: #a1a1aa;
      }
      .dark {
        --loading-bg: #09090b;
        --loading-text: #fafafa;
        --loading-logo: #71717a;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        background: var(--loading-bg);
        color: var(--loading-text);
      }
      /* Loading container - hidden when React renders */
      .loading-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--loading-bg);
        z-index: 9999;
        transition: opacity 150ms ease-out;
      }
      /* Hide loading when root has content */
      #root:not(:empty) + .loading-container,
      #root:not(:empty) ~ .loading-container {
        opacity: 0;
        pointer-events: none;
      }
      .loading-logo {
        width: 48px;
        height: 48px;
        animation: claw-grip 2s ease-in-out infinite;
      }
      .loading-logo path,
      .loading-logo circle,
      .loading-logo rect {
        fill: var(--loading-logo);
        stroke: var(--loading-logo);
      }
      @keyframes claw-grip {
        0%, 100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(0.95);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Loading indicator - separate from root so :empty works -->
    <div class="loading-container">
      <svg class="loading-logo" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Head/body top section -->
        <rect x="160" y="60" width="30" height="20" rx="5" fill="none" stroke-width="18"/>
        <rect x="210" y="60" width="30" height="20" rx="5" fill="none" stroke-width="18"/>
        <!-- Main head box -->
        <rect x="140" y="80" width="120" height="80" rx="8" fill="none" stroke-width="18"/>
        <!-- Eyes -->
        <circle cx="175" cy="120" r="10"/>
        <circle cx="225" cy="120" r="10"/>
        <!-- Left arm outer -->
        <path d="M 120 140 L 80 180 L 80 230 L 40 280 L 40 340 L 70 370 L 110 330" fill="none" stroke-width="18" stroke-linejoin="round"/>
        <!-- Left arm inner -->
        <path d="M 160 160 L 130 200 L 130 250 L 100 290" fill="none" stroke-width="18" stroke-linejoin="round"/>
        <!-- Right arm outer -->
        <path d="M 280 140 L 320 180 L 320 230 L 360 280 L 360 340 L 330 370 L 290 330" fill="none" stroke-width="18" stroke-linejoin="round"/>
        <!-- Right arm inner -->
        <path d="M 240 160 L 270 200 L 270 250 L 300 290" fill="none" stroke-width="18" stroke-linejoin="round"/>
      </svg>
    </div>
    <script>
      console.log("[HTML] Inline script running - scripts work!");
      window.onerror = function(msg, url, line) {
        console.error("[HTML] Global error:", msg, "at", url, "line", line);
        document.getElementById("root").innerHTML = "<pre style='color:red;padding:20px'>Error: " + msg + "</pre>";
      };
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
